<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOCKWARS AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>▦ BLOCKWARS <span>AI</span></h2>
    <p>YOUR WORLD. YOUR IMAGINATION.</p>
  </header>

  <main>
    <h1>Turn ideas into <span>moving worlds.</span></h1>
    <p>Create cinematic worlds with AI.</p>

    <section>
      <h2>Create a scene</h2>
      <textarea id="prompt" placeholder="Describe your video..."></textarea>
      <select id="style">
        <option>Cinematic voxel</option>
        <option>Blocky fantasy</option>
        <option>Retro game</option>
      </select>
      <button onclick="generate()">Generate preview ✦</button>
      <p id="result">Your creations will appear here.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
